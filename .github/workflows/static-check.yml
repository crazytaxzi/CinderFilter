name: static-check

on:
  push:
    branches: [main, consolidate-single-app]
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check ruff pytest
      - run: python -m compileall -q .
      - run: ruff check . --select E9,F63,F7,F82
      - run: pytest -q
